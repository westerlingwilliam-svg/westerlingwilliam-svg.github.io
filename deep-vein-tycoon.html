<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Vein Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --page: #e8d6b8;
  --panel: #fff4df;
  --panel-hi: #f7e2bd;
  --panel-lo: #ecd0a0;
  --edge: #b98a52;
  --edge-dk: #7c5530;
  --text: #3b2413;
  --muted: #86633f;
  --up: #2f8f2c;
  --gold: #ffc53a;
  --gold-dk: #d98a0b;
  --green: #5ccf4f;
  --green-dk: #2f8f2c;
  --red: #ef5145;
  --red-dk: #a82a20;
  --shadow: rgba(60, 30, 5, .35);
  --backdrop: rgba(30, 15, 5, .55);
  --wood1: #7a4a22;
  --wood2: #4f2d12;
  --wood-edge: #2a1608;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #120b06;
    --panel: #2a1b10;
    --panel-hi: #3a2616;
    --panel-lo: #20140b;
    --edge: #6d4726;
    --edge-dk: #4a2e16;
    --text: #fff0d6;
    --muted: #c9a47a;
    --up: #7ee06f;
    --shadow: rgba(0, 0, 0, .55);
    --backdrop: rgba(0, 0, 0, .62);
  }
}
:root[data-theme="dark"] {
  --page: #120b06;
  --panel: #2a1b10;
  --panel-hi: #3a2616;
  --panel-lo: #20140b;
  --edge: #6d4726;
  --edge-dk: #4a2e16;
  --text: #fff0d6;
  --muted: #c9a47a;
  --up: #7ee06f;
  --shadow: rgba(0, 0, 0, .55);
  --backdrop: rgba(0, 0, 0, .62);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--page);
  color: var(--text);
  font-family: 'Fredoka', ui-rounded, 'Trebuchet MS', system-ui, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#app { position: relative; height: 100%; display: flex; flex-direction: column; }

/* ---------- wooden HUD ---------- */
.woodbar {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 23px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 6px),
    linear-gradient(var(--wood1), var(--wood2));
  box-shadow: inset 0 2px 0 rgba(255, 220, 160, .25), 0 4px 10px rgba(0,0,0,.35);
}
#hud { justify-content: space-between; border-bottom: 3px solid var(--wood-edge); }
#bottombar { justify-content: space-between; border-top: 3px solid var(--wood-edge); box-shadow: inset 0 2px 0 rgba(255, 220, 160, .25), 0 -4px 10px rgba(0,0,0,.35); }

.cash-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 4px 18px 4px 4px;
  border-radius: 999px;
  background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.28));
  border: 2px solid rgba(255, 205, 120, .35);
  box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
}
.coin {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 34% 28%, #fff6c4 0 12%, #ffd24d 30%, #f0a414 62%, #a8600a 100%);
  border: 2px solid #6e3c04;
  box-shadow: inset 0 -3px 0 rgba(120, 60, 0, .45), 0 2px 0 #3a1e03;
  font-family: 'Lilita One', 'Fredoka', sans-serif;
  font-size: 21px;
  color: #7a4304;
  text-shadow: 0 1px 0 #ffe79a;
}
.coin.bump { animation: bump .28s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 45% { transform: scale(1.22) rotate(-8deg); } 100% { transform: scale(1); } }
.cash-text { min-width: 0; line-height: 1.05; }
.cash-val {
  font-family: 'Lilita One', 'Fredoka', sans-serif;
  font-size: 26px;
  color: #ffe08a;
  letter-spacing: .5px;
  text-shadow: 0 2px 0 #4a2305, 0 0 12px rgba(255, 200, 80, .35);
  white-space: nowrap;
}
.ips { font-size: 12.5px; font-weight: 600; color: #ffd79a; white-space: nowrap; }
.idle-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 999px;
  background: rgba(95, 207, 79, .22);
  color: #b9ffa8;
  font-size: 11px;
}
.idle-tag.off { background: rgba(255,255,255,.1); color: #d9bfa0; }
.hud-right { display: flex; gap: 8px; flex: 0 0 auto; }
.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  border: 2px solid var(--wood-edge);
  background: linear-gradient(#a06a36, #6b4119);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 3px 0 var(--wood-edge);
  font-size: 19px;
  cursor: pointer;
  transition: transform .08s;
}
.icon-btn:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 0 0 var(--wood-edge); }

/* ---------- stage ---------- */
#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #140d08; }
#game { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#toasts {
  position: absolute;
  top: 86px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  z-index: 4;
  width: max-content;
  max-width: 92%;
}
.toast {
  padding: 9px 16px;
  border-radius: 14px;
  background: linear-gradient(rgba(38, 20, 8, .95), rgba(22, 11, 4, .95));
  border: 2px solid var(--gold);
  color: #ffe9bd;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,.45);
  animation: toastIn .35s cubic-bezier(.2, 1.5, .4, 1), toastOut .45s ease-in 2.7s forwards;
  text-align: center;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }
#scrollHint {
  position: absolute;
  left: 50%;
  bottom: 68px;
  transform: translateX(-50%);
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(0,0,0,.55);
  color: #f7dfb8;
  font-size: 13px;
  pointer-events: none;
  transition: opacity .6s;
  white-space: nowrap;
}
#scrollHint.gone { opacity: 0; }

/* ---------- bottom bar ---------- */
.nav-btn {
  flex: 0 0 auto;
  height: 48px;
  padding: 0 14px;
  border-radius: 14px;
  border: 2px solid var(--wood-edge);
  background: linear-gradient(#a06a36, #6b4119);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 4px 0 var(--wood-edge);
  color: #ffe6c0;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-btn:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 1px 0 var(--wood-edge); }

.hud-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.gem-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 13px 4px 4px;
  border-radius: 999px;
  background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.28));
  border: 2px solid rgba(150, 230, 255, .35);
  box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
  font-family: 'Lilita One', 'Fredoka', sans-serif;
  font-size: 19px;
  color: #c9f6ff;
  text-shadow: 0 2px 0 #0a3a4a;
}
.gem {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 16px;
  background: radial-gradient(circle at 35% 30%, #effdff, #8fe2f7 45%, #2a8fb8);
  border: 2px solid #0f4a63;
  box-shadow: inset 0 -3px 0 rgba(0, 40, 60, .35);
}
.gem.bump { animation: bump .28s ease-out; }
.research-btn {
  position: relative;
  flex: 0 1 280px;
  margin: 0 auto;
  min-width: 0;
  height: 48px;
  border-radius: 14px;
  border: 2px solid #1f3d66;
  background: linear-gradient(#86c9f7, #3a78c4);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 4px 0 #1f3d66;
  font-family: 'Lilita One', 'Fredoka', sans-serif;
  font-size: 18px;
  color: #fff;
  text-shadow: 0 2px 0 rgba(0,0,0,.3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.research-btn:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 1px 0 #1f3d66; }
.res-badge {
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 13px;
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .28);
  color: #dff8ff;
  text-shadow: none;
  transition: background .3s, color .3s;
}
.research-btn.ready .res-badge { background: #ffd84d; color: #4a2300; }
#eventChip {
  position: absolute;
  left: 50%;
  top: 10px;
  transform: translateX(-50%);
  z-index: 5;
  min-width: 210px;
  text-align: center;
  max-width: calc(100% - 60px);
  padding: 8px 13px 10px;
  border-radius: 14px;
  background: linear-gradient(rgba(38, 20, 8, .93), rgba(22, 11, 4, .93));
  border: 2px solid var(--gold);
  color: #ffe9bd;
  box-shadow: 0 6px 18px rgba(0,0,0,.45);
  cursor: pointer;
  animation: toastIn .45s cubic-bezier(.2, 1.5, .4, 1);
}
#eventChip[data-type="surge"] { border-color: #6ac8ff; }
#eventChip[data-type="shower"] { border-color: #9ff3ff; }
#eventChip[data-type="vein"] { border-color: #ffe36a; }
#evTitle { font-family: 'Lilita One', 'Fredoka', sans-serif; font-size: 16px; }
.ev-sub { font-size: 12.5px; color: #d9bfa0; margin-top: 1px; }
.ev-bar { height: 5px; margin-top: 7px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
.ev-bar > div { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffe06a, #f0a414); }
#eventChip[data-type="surge"] .ev-bar > div, #eventChip[data-type="shower"] .ev-bar > div { background: linear-gradient(90deg, #bff4ff, #3aa6d8); }

/* ---------- mobile layout (also when chosen on a big screen) ---------- */
:root[data-layout="mobile"] body { background: #0b0704; }
:root[data-layout="mobile"] #app {
  max-width: 480px;
  margin: 0 auto;
  box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 0 70px rgba(0,0,0,.65);
}
:root[data-layout="mobile"] #hud { padding: 7px 9px; gap: 6px; }
:root[data-layout="mobile"] .hud-left { gap: 6px; }
:root[data-layout="mobile"] .cash-pill { padding-right: 12px; gap: 8px; }
:root[data-layout="mobile"] .cash-val { font-size: 21px; }
:root[data-layout="mobile"] .coin { width: 34px; height: 34px; font-size: 17px; }
:root[data-layout="mobile"] .ips .idle-tag { display: none; }
:root[data-layout="mobile"] .gem-pill { font-size: 16px; padding-right: 10px; gap: 5px; }
:root[data-layout="mobile"] .gem { width: 27px; height: 27px; font-size: 13px; }
:root[data-layout="mobile"] .hud-right { gap: 6px; }
:root[data-layout="mobile"] .icon-btn { width: 38px; height: 38px; font-size: 17px; border-radius: 12px; }
:root[data-layout="mobile"] #bottombar { padding: 8px 9px; gap: 8px; }
:root[data-layout="mobile"] .nav-btn { height: 52px; padding: 0 16px; font-size: 20px; }
:root[data-layout="mobile"] .nav-btn span { display: none; }
:root[data-layout="mobile"] .research-btn { height: 52px; font-size: 16px; flex: 1; gap: 6px; }
:root[data-layout="mobile"] .research-btn .res-badge { display: none; }
:root[data-layout="mobile"] .mid-group { gap: 6px; }
:root[data-layout="mobile"] .mg-tabs button { font-size: 12.5px; }
:root[data-layout="mobile"] .as-row { grid-template-columns: 70px 1fr; }
:root[data-layout="mobile"] #eventChip { top: auto; bottom: 12px; left: 12px; transform: none; text-align: left; min-width: 0; }
:root[data-layout="mobile"] #toasts { top: 12px; }
:root[data-layout="mobile"] .toast { font-size: 13.5px; }
:root[data-layout="mobile"] .seg button { height: 44px; }
:root[data-layout="mobile"] .big-btn { min-height: 62px; }
@media (max-width: 370px) {
  :root[data-layout="mobile"] .gem-pill { display: none; }
}

/* ---------- layout chooser ---------- */
.lay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
.lay-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 20px 10px 14px;
  border-radius: 16px;
  border: 2px solid var(--edge);
  background: var(--panel-hi);
  box-shadow: 0 4px 0 var(--edge);
  color: var(--text);
  text-align: center;
  cursor: pointer;
}
.lay-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.lay-card.rec { border-color: var(--gold-dk); background: linear-gradient(rgba(255, 197, 58, .28), var(--panel-hi)); }
.lay-card.cur { outline: 3px solid var(--up); outline-offset: 2px; }
.lay-card b { font-family: 'Lilita One', 'Fredoka', sans-serif; font-weight: 400; font-size: 21px; }
.lay-card > span:last-child { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.lay-rec {
  position: absolute;
  top: -11px;
  left: 50%;
  transform: translateX(-50%);
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--gold-dk);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.lay-ic { height: 60px; display: grid; place-items: center; }
.lay-ic i {
  display: block;
  border: 3px solid #3b2413;
  border-radius: 8px;
  background: linear-gradient(#7cc3f5 0 38%, #6cc444 38% 45%, #7b4e2a 45% 64%, #1a120c 64% 76%, #5f4a3a 76%);
  box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.lay-mobile i { width: 32px; height: 56px; }
.lay-desktop i { width: 70px; height: 44px; border-radius: 5px; }

/* ---------- boost all ---------- */
.boost-all {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 46px;
  padding: 0 20px;
  border-radius: 999px;
  border: 2px solid #6e3202;
  background: linear-gradient(#ffe06a, #f09a14);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 4px 0 #6e3202, 0 8px 18px rgba(0,0,0,.45);
  font-family: 'Lilita One', 'Fredoka', sans-serif;
  font-size: 18px;
  color: #4a2300;
  cursor: pointer;
  white-space: nowrap;
  transition: filter .3s;
}
.boost-all:active { transform: translateX(-50%) translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 1px 0 #6e3202, 0 4px 10px rgba(0,0,0,.4); }
.boost-all.active { background: linear-gradient(#fff38a, #ffb31a); box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 4px 0 #6e3202, 0 0 20px rgba(255, 200, 40, .85); }
.boost-all.cooldown { border-color: #3f2e1d; background: linear-gradient(#c3b096, #8a755e); color: #2a1c10; box-shadow: inset 0 2px 0 rgba(255,255,255,.3), 0 4px 0 #3f2e1d, 0 8px 18px rgba(0,0,0,.4); cursor: default; }
.ba-count { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,.16); }
:root[data-layout="mobile"] #eventChip { bottom: 70px; }
:root[data-layout="mobile"] .boost-all { height: 50px; font-size: 18px; }

/* ---------- settings ---------- */
.set-sec { margin-bottom: 14px; }
.set-title {
  margin: 0 4px 6px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.set-card {
  background: var(--panel-hi);
  border: 1px solid rgba(0,0,0,.08);
  border-radius: 16px;
  overflow: hidden;
}
.set-row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 12px; }
.set-row + .set-row { border-top: 1px solid rgba(0,0,0,.08); }
.set-ic { font-size: 21px; text-align: center; }
.set-txt { min-width: 0; }
.set-txt b { display: block; font-size: 15px; }
.set-txt span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.switch {
  position: relative;
  width: 54px;
  height: 30px;
  padding: 0;
  border-radius: 999px;
  border: 2px solid rgba(0,0,0,.22);
  background: #b9a893;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.2);
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.switch i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 3px rgba(0,0,0,.3);
  transition: transform .22s cubic-bezier(.3, 1.4, .5, 1);
}
.switch.on { background: linear-gradient(#86ea6a, #2f9e2c); border-color: #1c5e1a; }
.switch.on i { transform: translateX(24px); }
.set-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 12px; }
.set-seg button {
  height: 44px;
  border-radius: 12px;
  border: 2px solid var(--edge);
  background: var(--panel);
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
}
.set-seg button.on { background: linear-gradient(#ffe06a, #f0a414); border-color: #9a5a05; color: #4a2300; box-shadow: inset 0 2px 0 rgba(255,255,255,.55); }
.set-card .kv { margin: 0; padding: 12px 14px; }
.set-sec.danger .set-title { color: var(--red); }
.set-sec.danger .set-card { border-color: rgba(239, 81, 69, .4); background: linear-gradient(rgba(239, 81, 69, .08), var(--panel-hi)); }
.set-danger {
  height: 38px;
  padding: 0 16px;
  border-radius: 11px;
  border: 2px solid #6d1a12;
  background: linear-gradient(#ff7a6a, #c42d1f);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 #6d1a12;
  color: #fff;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.set-danger:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 1px 0 #6d1a12; }
.set-danger.armed { background: linear-gradient(#ffb04a, #e0461f); }
.set-about { text-align: center; margin: 4px 0 0; }

/* ---------- bottom bar centre group ---------- */
.mid-group { display: flex; gap: 8px; flex: 0 1 580px; margin: 0 auto; min-width: 0; }
.mid-group .research-btn { flex: 1; margin: 0; }
.research-btn.mgr {
  border-color: #3d1e70;
  background: linear-gradient(#c7a2ff, #7a45d0);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 4px 0 #3d1e70;
}
.research-btn.mgr:active { box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 1px 0 #3d1e70; }
:root[data-layout="mobile"] .research-btn.ready::after {
  content: '';
  position: absolute;
  top: 5px;
  right: 7px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #ffd84d;
  box-shadow: 0 0 0 2px rgba(0,0,0,.3);
}

/* ---------- rarities ---------- */
.r-common { --rc: #8f9aa6; }
.r-uncommon { --rc: #43b54f; }
.r-rare { --rc: #3a8ee8; }
.r-epic { --rc: #a55cf0; }
.r-legendary { --rc: #f0a414; }
.r-mythic { --rc: #ff3d6e; }

/* ---------- managers modal ---------- */
.mg-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.mg-tabs button {
  height: 40px;
  border-radius: 11px;
  border: 2px solid var(--edge);
  background: var(--panel-hi);
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
  padding: 0 4px;
  cursor: pointer;
}

/* ---------- box opening show ---------- */
body.fx-on .backdrop { -webkit-backdrop-filter: none; backdrop-filter: none; }
body.fx-on .modal { visibility: hidden; }
.bfx { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; overflow: hidden; cursor: pointer; --glow: #ffd84d; }
.bfx.hidden { display: none; }
.bfx-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--glow) 26%, rgb(18, 9, 4)), rgb(8, 4, 2) 72%);
  opacity: .97;
  animation: bfxFade .35s ease-out both;
}
.bfx-rays {
  position: absolute;
  left: 50%;
  top: 45%;
  width: 180vmax;
  height: 180vmax;
  margin: -90vmax 0 0 -90vmax;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--glow) 60%, transparent) 0deg 7deg, transparent 7deg 18deg);
  -webkit-mask-image: radial-gradient(circle, #000 0, transparent 50%);

  pointer-events: none;
}
.phase-open .bfx-rays { animation: bfxRaysIn .5s ease-out forwards, bfxSpin 16s linear infinite; }
.bfx-stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 44px; }
.bfx-box { position: relative; width: 160px; height: 140px; transform: translateY(-120vh); }
.phase-drop .bfx-box { animation: bfxDrop .62s cubic-bezier(.3, 1.45, .5, 1) forwards; }
.phase-shake .bfx-box { transform: none; animation: bfxShake 1.05s ease-in-out forwards; }
.phase-open .bfx-box { transform: none; animation: bfxGone .45s .2s ease-in forwards; }
.bfx-body {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 104px;
  display: grid;
  place-items: center;
  border-radius: 16px;

  background: var(--bx1);

}
.bfx-body::before, .bfx-body::after { content: ''; position: absolute; top: 0; bottom: 0; width: 14px; background: var(--bx2); opacity: .85; }
.bfx-body::before { left: 20%; }
.bfx-body::after { right: 20%; }
.bfx-body span { position: relative; z-index: 1; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
.bfx-lid {
  position: absolute;
  left: -10px;
  right: -10px;
  top: 12px;
  height: 38px;
  z-index: 2;
  border-radius: 13px;
  border: 5px solid var(--bx2);
  background: var(--bx1);
  box-shadow: inset 0 -7px 0 rgba(0,0,0,.18), inset 0 5px 0 rgba(255,255,255,.3);
}
.bfx-lid::after { content: ''; position: absolute; left: 50%; bottom: -14px; width: 22px; height: 18px; margin-left: -11px; border-radius: 0 0 6px 6px; background: var(--bx2); }
.phase-open .bfx-lid { animation: bfxLid .75s cubic-bezier(.2, .8, .3, 1) forwards; }
.bfx-glow { position: absolute; left: 50%; top: 55%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; }
.phase-shake .bfx-glow { animation: bfxGlow 1.05s ease-in forwards; }
.bfx-box.bx-crate { --bx1: linear-gradient(#cf9352, #8a5424); --bx2: #5a3414; }
.bfx-box.bx-chest { --bx1: linear-gradient(#7a828f, #3b414b); --bx2: #d4a017; }
.bfx-box.bx-vault { --bx1: linear-gradient(#fff0a0, #e0960c); --bx2: #7a4a04; }
.bfx-box.bx-crystal { --bx1: linear-gradient(#d8faff, #3aa6d8); --bx2: #1f5f8a; }
.bfx-name { font-family: 'Lilita One', 'Fredoka', sans-serif; font-size: 24px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.45); }
.bfx-name b { font-weight: 400; color: #ffd84d; }
.phase-open .bfx-name { animation: bfxGone .3s ease-in forwards; }
.bfx-burst { position: absolute; left: 50%; top: 45%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; background: radial-gradient(circle, #fff 0, var(--glow) 55%, transparent 70%); opacity: 0; pointer-events: none; }
.phase-open .bfx-burst { animation: bfxBurst .7s ease-out forwards; }
.bfx-sparks { position: absolute; left: 50%; top: 45%; width: 0; height: 0; pointer-events: none; }
.bfx-sparks i { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px var(--glow); opacity: 0; }
.phase-open .bfx-sparks i { animation: bfxSpark var(--t) ease-out forwards; }
.bfx-skip { position: absolute; bottom: max(26px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.65); font-size: 13px; font-weight: 600; }
.bfx-results {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;

}

.phase-results .bfx-results { justify-content: flex-start; }

.phase-results .bfx-stage, .phase-results .bfx-skip { display: none; }
.bfx-title { font-family: 'Lilita One', 'Fredoka', sans-serif; font-size: 34px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 24px var(--glow); margin-bottom: 8px; animation: pop .45s cubic-bezier(.2, 1.5, .4, 1) both; text-align: center; }
.bfx-counts { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; margin-bottom: 14px; font-size: 13px; font-weight: 700; color: #fff; }
.bfx-counts span::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; background: var(--rc); }
.bfx-grid { margin-top: 6px; }
.bfx-grid.single { width: min(250px, 78vw); }

.bfx-grid.multi { display: grid; grid-template-columns: repeat(5, 112px); gap: 12px 10px; padding-top: 4px; }

@media (max-width: 680px) {

  .bfx-grid.multi .mt { padding: 8px 3px 7px; border-radius: 14px; }

  .bfx-grid.multi .mt-chip { font-size: 11px; padding: 0 6px; }
  .bfx-grid.multi .mt-name { font-size: 11px; margin-top: 3px; }
  .bfx-grid.multi .mt-rar { font-size: 8.5px; letter-spacing: .06em; }
  .bfx-title { font-size: 28px; }
}
.bfx-card { position: relative; display: flex; perspective: 700px; }
.bfx-card.wait { opacity: 0; transform: scale(.2) translateY(30px); }
.bfx-card.in { animation: bfxPop .6s cubic-bezier(.2, 1.6, .4, 1) both; }
.bfx-card > .mt { position: relative; z-index: 1; }
.bfx-flash, .bfx-ring { position: absolute; pointer-events: none; opacity: 0; }
.bfx-flash { inset: -30%; z-index: 0; border-radius: 50%; background: radial-gradient(circle, var(--rc) 0, transparent 62%); }
.bfx-ring { inset: -4px; z-index: 2; border-radius: 20px; border: 3px solid var(--rc); }
.bfx-card.in .bfx-flash { animation: bfxFlash .8s ease-out both; }
.bfx-card.in .bfx-ring { animation: bfxRing .7s ease-out both; }
.bfx-card.in.r-epic .bfx-ring.two, .bfx-card.in.r-legendary .bfx-ring.two, .bfx-card.in.r-mythic .bfx-ring.two { animation: bfxRing .8s .18s ease-out both; }
.bfx-card.in.r-legendary .bfx-flash, .bfx-card.in.r-mythic .bfx-flash { animation: bfxFlashBig 1.1s ease-out both; }
.bfx-card.in.r-legendary > .mt, .bfx-card.in.r-mythic > .mt { animation: bfxHalo 1.6s ease-in-out .5s infinite alternate; }
.bfx-results .later { opacity: 0; pointer-events: none; transition: opacity .4s; }
.bfx-results.done .later { opacity: 1; pointer-events: auto; }
.bfx-results .bfx-actions { animation: none; }
.bfx-title.bump-in { animation: bfxTitle .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.bfx-spot { position: absolute; left: 50%; top: 50%; z-index: 6; width: min(236px, 68vw); transform: translate(-50%, -50%); display: none; pointer-events: none; }
.bfx-spot.show { display: block; animation: bfxSpotIn .5s cubic-bezier(.2, 1.5, .4, 1); }
.bfx-spot .mt { position: relative; z-index: 1; padding: 22px 14px 16px; }
.bfx-spot .mt-face { width: 112px; height: 112px; border-radius: 28px; }
.bfx-spot .mt-name { font-size: 20px; }
.bfx-spot .mt-chip { font-size: 18px; padding: 2px 12px; }
.bfx-spot .mt-rar { font-size: 12px; }
.bfx-spot .mt-eff { font-size: 13px; }
.bfx-spot.show .bfx-flash { animation: bfxFlashBig 1s ease-out both; }
.bfx-spot.show .bfx-ring { animation: bfxRing .8s ease-out both; }
.bfx-spot.show .bfx-ring.two { animation: bfxRing .9s .2s ease-out both; }
.bfx-spot.show.r-legendary .mt, .bfx-spot.show.r-mythic .mt { animation: bfxHalo .7s ease-in-out infinite alternate; }
.bfx-spot.show.r-mythic .bfx-spot-rar { animation: bfxMythic 1.2s linear infinite; }
.bfx-spot-rar {
  position: absolute;
  left: -40px;
  right: -40px;
  top: -48px;
  z-index: 2;
  text-align: center;
  font-family: 'Lilita One', 'Fredoka', sans-serif;
  font-size: 32px;
  color: #fff;
  text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 22px var(--rc);
  animation: bfxTitle .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
.bfx-results.spotting .bfx-grid { opacity: .28; transition: opacity .2s; }
.bfx-results.spotting .bfx-title { opacity: .5; }
@keyframes bfxSpotIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-18deg); }
  60% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(4deg); }
  100% { opacity: 1; transform: translate(-50%, -50%); }
}
@keyframes bfxMythic { 0% { color: #ff6b8a; } 33% { color: #ffd84d; } 66% { color: #8affc0; } 100% { color: #ff6b8a; } }
@keyframes bfxPop {
  0% { opacity: 0; transform: scale(.2) rotate(-14deg) translateY(40px); }
  55% { opacity: 1; transform: scale(1.14) rotate(4deg) translateY(-6px); }
  75% { transform: scale(.96) rotate(-1deg); }
  100% { opacity: 1; transform: none; }
}
@keyframes bfxFlash { 0% { opacity: .95; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.4); } }
@keyframes bfxFlashBig { 0% { opacity: 1; transform: scale(.3); } 40% { opacity: .9; } 100% { opacity: 0; transform: scale(2.2); } }
@keyframes bfxRing { 0% { opacity: .95; transform: scale(.85); } 100% { opacity: 0; transform: scale(1.4); } }
@keyframes bfxHalo { from { box-shadow: 0 0 20px -6px var(--rc), 0 4px 0 color-mix(in srgb, var(--rc) 55%, #000); } to { box-shadow: 0 0 44px 2px var(--rc), 0 4px 0 color-mix(in srgb, var(--rc) 55%, #000); } }
@keyframes bfxTitle { 0% { transform: scale(.6); opacity: .3; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: none; } }
.bfx-card .mt { flex: 1; width: 100%; box-shadow: 0 0 34px -6px var(--rc), 0 4px 0 color-mix(in srgb, var(--rc) 55%, #000); }
.bfx-actions { display: grid; gap: 10px; width: min(320px, 90vw); margin-top: 20px; animation: bfxFade .4s .35s both; }
.bfx-actions .mg-sec { margin: 0; }
@keyframes bfxFade { from { opacity: 0; } }
.bfx-bg { animation-name: bfxBgIn; }
@keyframes bfxBgIn { from { opacity: 0; } to { opacity: .97; } }
@keyframes bfxRaysIn { to { opacity: .6; } }
@keyframes bfxSpin { to { transform: rotate(360deg); } }
@keyframes bfxDrop { from { transform: translateY(-120vh) rotate(-8deg); } to { transform: none; } }
@keyframes bfxShake {
  0%, 100% { transform: none; }
  10% { transform: rotate(-3deg); }
  20% { transform: rotate(4deg); }
  30% { transform: rotate(-6deg) translateY(-3px); }
  40% { transform: rotate(7deg); }
  50% { transform: rotate(-9deg) scale(1.04); }
  60% { transform: rotate(10deg) scale(1.07); }
  70% { transform: rotate(-11deg) scale(1.1) translateY(-4px); }
  80% { transform: rotate(11deg) scale(1.13); }

}
@keyframes bfxLid { to { transform: translate(60px, -300px) rotate(40deg); opacity: 0; } }
@keyframes bfxGone { to { transform: scale(.3) translateY(30px); opacity: 0; } }
@keyframes bfxGlow { from { box-shadow: 0 0 0 0 var(--glow); } to { box-shadow: 0 0 70px 60px var(--glow); } }
@keyframes bfxBurst { 0% { opacity: 1; transform: scale(0); } 60% { opacity: .9; } 100% { opacity: 0; transform: scale(28); } }
@keyframes bfxSpark { 0% { opacity: 1; transform: rotate(var(--a)) translateX(0) scale(1); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scale(.3); } }

@media (prefers-reduced-motion: reduce) {

}

  content: '';

  bottom: 0;
  left: -60%;

function moveTo(e, tx, spd, dt) {

function updateMiners(dt) {
  const t = now();
  S.shafts.forEach((sh, i) => {
    const arr = R.miners[i];
    if (!arr) return;
    const L = sh.level;
    const boost = (t < sh.boostUntil ? 2 : 1) * areaSpeed('shaft', i);
    const spd = Shaft.walk(L) * boost;
    const ore = ORES[i % ORES.length];
    const fl = floorY(i);
    for (const m of arr) {
      switch (m.state) {
        case 'idle':
          m.face = 1;
          if (sh.manager) m.state = 'toOre';
          break;
        case 'toHome':
          if (moveTo(m, homeX(m), spd * m.jit, dt)) { m.state = 'idle'; m.face = 1; }
          if (sh.manager) m.state = 'toOre';
          break;
        case 'toOre':
          if (moveTo(m, ORE_FACE - m.idx * LAY.mineGap, spd * m.jit, dt)) {
            m.state = 'mining';
            m.timer = Shaft.mine(L) / boost;
            m.swing = 0;
            m.hitDone = true;
            m.face = 1;
          }
          break;
        case 'mining': {
          m.timer -= dt;
          const prev = m.swing;
          m.swing += dt * boost * 2.3;
          if (Math.floor(m.swing) !== Math.floor(prev)) m.hitDone = false;
          if (!m.hitDone && m.swing % 1 > 0.72) {
            m.hitDone = true;
            spawnChips(ORE_FACE + 20 - m.idx * 5, fl - 24 - Math.random() * 12, ore, 4, fl - 2);
            if (isVisible(fl - 60, fl)) Snd.clink();
          }
          if (m.timer <= 0) {
            const vein = eventActive('vein') && S.event.shaft === i ? 3 : 1;
            m.carry = Shaft.load(i, L) * vein * areaCash('shaft', i);
            m.state = 'toStash';
            S.oreMined += m.carry;
            const chance = 0.005 * (1 + 0.25 * RS('luck')) * (eventActive('shower') ? 12 : 1);
            if (Math.random() < chance) {
              S.gems++;
              addText('+1 💎', ORE_FACE - 16, fl - 72, '#bff4ff', 1.1);
              spawnCoinsToHud(ORE_FACE - 16, fl - 60, 1, true);
              Snd.gem();
            }
          }
          break;
        }
        case 'toStash':
          if (moveTo(m, STASH_X + STASH_W + 8 + m.idx * LAY.dropGap, spd * m.jit, dt)) {
            sh.stash += m.carry;
            addText('+' + fmt(m.carry), STASH_X + STASH_W / 2, fl - 58, ore.g, 0.9);
            spawnBurst(STASH_X + STASH_W / 2, fl - 34, ore, 5);
            m.carry = 0;

  return true;
}

  const liftCash = areaCash('elevator', 0);

      break;

      }

    }
    case 'up':

      break;
    case 'unloading': {

      const give = Math.min(c.carry, lr * dt);
      c.carry -= give;
      S.surfaceStash += give;
      if (c.carry <= 1e-6) {
        c.carry = 0;
        c.state = 'idle';
        c.wait = 0.25;
        S.trips++;

          addText('+' + fmt(c.trip), LAY.boothX + 35, SURFACE_Y - 60, '#ffe7a6', 0.9);

  c.settle = Math.max(0, (c.settle || 0) - dt * 2.4);
  c.vy = (c.y - y0) / Math.max(dt, 1e-4);
}

function updateTrans(dt) {
  const W = S.warehouse, L = W.level;
  const boost = (now() < W.boostUntil ? 2 : 1) * areaSpeed('warehouse', 0);
  const spd = Ware.speed(L) * boost, cap = Ware.cap(L), lr = Ware.loadRate(L) * boost;
  let enRoute = 0;
  for (const t of R.trans) if (t.state === 'toLoad') enRoute++;
  for (const t of R.trans) {
    switch (t.state) {
      case 'idle':
        t.wait -= dt;
        t.face = -1;
        if (W.manager && t.wait <= 0 && S.surfaceStash > enRoute * cap * 0.5 + 0.5) {
          t.state = 'toLoad';
          enRoute++;
        }
        break;
      case 'toLoad':
        if (moveTo(t, LOAD_X + t.idx * LAY.loadGap, spd * t.jit, dt)) { t.state = 'loading'; t.wait = 0.2; }
        break;
      case 'loading': {
        if (t.wait > 0) { t.wait -= dt; break; }
        const take = Math.min(S.surfaceStash, cap - t.carry, lr * dt);
        if (take > 0) { S.surfaceStash -= take; t.carry += take; }
        const waitingForCabin = t.carry === 0 && R.cabin.state === 'unloading';
        if (!waitingForCabin && (t.carry >= cap * 0.9999 || S.surfaceStash <= 1e-6)) {
          t.state = 'toSell';
          t.face = 1;
        }
        break;
      }
      case 'toSell':
        if (moveTo(t, WH_DOOR_X + 26, spd * t.jit, dt)) { t.state = 'selling'; t.wait = 0.35; }
        break;
      case 'selling':
        t.wait -= dt;
        if (t.wait <= 0) {
          if (t.carry > 0) earn(t.carry * areaCash('warehouse', 0), WH_DOOR_X + 32, SURFACE_Y - 64);
          t.carry = 0;
          t.state = 'toHome';
        }
        break;
      case 'toHome':
        if (moveTo(t, transHome(t.idx), spd * t.jit, dt)) { t.state = 'idle'; t.wait = 0.1; t.face = -1; }
        break;
    }
  }
}

function tapShaft(i) {
  let n = 0;
  for (const m of R.miners[i]) {
    if (m.state === 'idle' || m.state === 'toHome') { m.state = 'toOre'; n++; }
  }
  if (n) { Snd.click(); buzz(8); tutorialStep(); }
  return n > 0;
}
function tapElevator() {
  if (startCabin()) { Snd.click(); buzz(8); return true; }
  return false;
}
function tapWarehouse() {
  let n = 0;
  for (const t of R.trans) {
    if (t.state === 'idle' || t.state === 'toHome') { t.state = 'toLoad'; n++; }
  }
  if (n) { Snd.click(); buzz(8); }
  return n > 0;
}

function earn(amount, wx, wy) {
  const mult = (eventActive('rush') ? 2 : 1) * rebirthMult() * THEME.mult * mineBonus();
  const v = amount * mult;
  S.cash += v;
  S.totalEarned += v;
  R.earnLog.push([R.time, v]);
  addText('+$' + fmt(v), wx, wy, mult > 1 ? '#fff27a' : '#ffd84d', 1.25);
  spawnCoinsToHud(wx, wy, Math.min(7, 2 + Math.floor(Math.log10(v + 1))));
  spawnBurst(wx, wy + 20, ORES[4], 6);
  Snd.coin();
}
function measuredIps() {
  const cut = R.time - 30;
  while (R.earnLog.length && R.earnLog[0][0] < cut) R.earnLog.shift();
  let s = 0;
  for (const e of R.earnLog) s += e[1];
  return s / clamp(R.time, 5, 30);
}

function updateParticles(dt) {
  const P = R.particles;
  for (let k = P.length - 1; k >= 0; k--) {
    const p = P[k];
    p.life -= dt;
    if (p.life <= 0) { P[k] = P[P.length - 1]; P.pop(); continue; }
    p.vy += (p.g || 0) * dt;
    if (p.drag) { p.vx *= 1 - Math.min(1, p.drag * dt); p.vy *= 1 - Math.min(1, p.drag * dt * 0.3); }
    if (p.kind === 'firefly') {
      p.vx += (Math.random() - 0.5) * 60 * dt;
      p.vy += (Math.random() - 0.5) * 60 * dt;
      p.vx *= 0.98; p.vy *= 0.98;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.vr) p.rot += p.vr * dt;
    if (p.grow) p.size += p.grow * dt;
    if (p.floor !== undefined && p.y > p.floor) {
      p.y = p.floor;
      p.vy *= -0.3;
      p.vx *= 0.55;
      p.vr = (p.vr || 0) * 0.5;
    }
  }
  if (P.length > 700) P.splice(0, P.length - 700);
  for (let k = R.texts.length - 1; k >= 0; k--) {
    const t = R.texts[k];
    t.life -= dt;
    t.y -= 30 * dt * (0.4 + t.life / t.max);
    if (t.life <= 0) R.texts.splice(k, 1);
  }
  for (let k = R.coins.length - 1; k >= 0; k--) {
    const c = R.coins[k];
    c.t += dt;
    if (c.t >= c.dur) {
      R.coins.splice(k, 1);
      const el = $(c.gem ? '#hudGem' : '#hudCoin');
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }
  }
  for (let k = R.ripples.length - 1; k >= 0; k--) {
    R.ripples[k].t += dt;
    if (R.ripples[k].t > 0.5) R.ripples.splice(k, 1);
  }
  R.shake = Math.max(0, R.shake - dt * 1.6);
}

/* ==========================================================================
   Part 2: rendering
   ========================================================================== */
const cv = $('#game');
let ctx = cv.getContext('2d');
let VW = 1, VH = 1, DPR = 1, SCALE = 1, OFFX = 0;

function resize() {
  const r = cv.getBoundingClientRect();
  VW = Math.max(1, r.width);
  VH = Math.max(1, r.height);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(VW * DPR);
  cv.height = Math.round(VH * DPR);
  SCALE = clamp(VW / WORLD_W, 0.6, LAY.mode === 'mobile' ? 1.25 : 1.3);
  clampCam();
}
function computeOffX() {
  const ww = WORLD_W * SCALE;
  OFFX = ww <= VW ? (VW - ww) / 2 : -R.camX * SCALE;
}
function clampCam() {
  const vh = VH / SCALE;
  R.camY = clamp(R.camY, 0, Math.max(0, worldHeight() - vh));
  const vw = VW / SCALE;
  R.camX = clamp(R.camX, 0, Math.max(0, WORLD_W - vw));
}

/* ------------------------------ Primitives ------------------------------ */
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circ(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
}
function ln(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}
function txt(s, x, y, size, color, align, font, stroke, sw) {
  ctx.font = `${font === FONT_D ? '400' : '700'} ${size}px ${font || FONT}`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = sw || 3;
    ctx.strokeStyle = stroke;
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
function addHit(x, y, w, h, fn) { R.hits.push({ x, y, w, h, fn }); }
function woodGrad(x0, y0, x1, y1, a, b) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, a);
  g.addColorStop(1, b);
  return g;
}

/* --------------------------- Static generation --------------------------- */
function makeRockTile() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const t = c.getContext('2d');
  const r = seeded(99);
  for (let k = 0; k < 1800; k++) {
    const x = r() * 256, y = r() * 256, s = r() * 1.8 + 0.4;
    t.fillStyle = r() < 0.55 ? `rgba(0,0,0,${0.06 + r() * 0.16})` : `rgba(255,235,210,${0.03 + r() * 0.06})`;
    t.fillRect(x, y, s, s);
  }
  for (let k = 0; k < 55; k++) {
    const x = r() * 256, y = r() * 256, rx = 3 + r() * 9, ry = rx * (0.5 + r() * 0.4), a = r() * 3;
    const light = 0.06 + r() * 0.08;
    for (const ox of [-256, 0, 256]) {
      for (const oy of [-256, 0, 256]) {
        const px = x + ox, py = y + oy;

/* ------------------------------ Day / night ------------------------------ */
function dayInfo() {
  const p = ((R.time + DAY_LEN * 0.36) / DAY_LEN) % 1;
  const h = -Math.cos(p * Math.PI * 2);
  const day = clamp((h + 0.12) / 0.45, 0, 1);
  const dusk = clamp(1 - Math.abs(h) / 0.32, 0, 1);
  return { p, h, day, night: 1 - day, dusk };
}

function drawSky(xL, xR, top) {

  const midC = mixHex(mixHex('#141a46', '#7cc3f5', D.day), '#c46a8a', D.dusk * 0.55);

function drawDecor(d) {
  const T = R.time;
  switch (d.type) {
    case 'rock':
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(d.x + 1, d.y + 2, 7 * d.s, 4.4 * d.s, d.a, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(170,150,130,0.4)';
      ctx.beginPath(); ctx.ellipse(d.x, d.y, 7 * d.s, 4.4 * d.s, d.a, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.ellipse(d.x - 2 * d.s, d.y - 1.5 * d.s, 3 * d.s, 1.6 * d.s, d.a, 0, Math.PI * 2); ctx.fill();
      break;
    case 'fossil': {
      ctx.strokeStyle = 'rgba(235,215,175,0.45)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      for (let t = 0; t < Math.PI * 4; t += 0.25) {
        const r = (1 + t * 1.25) * d.s;
        const px = d.x + Math.cos(t + d.a) * r, py = d.y + Math.sin(t + d.a) * r;
        if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.lineWidth = 0.8;
      for (let t = 1; t < Math.PI * 4; t += 0.9) {
        const r = (1 + t * 1.25) * d.s;
        ln(d.x + Math.cos(t + d.a) * r * 0.6, d.y + Math.sin(t + d.a) * r * 0.6, d.x + Math.cos(t + d.a) * r, d.y + Math.sin(t + d.a) * r);
      }
      break;
    }
    case 'bone':
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.a);
      ctx.fillStyle = 'rgba(235,225,205,0.5)';
      ctx.fillRect(-8 * d.s, -1.4 * d.s, 16 * d.s, 2.8 * d.s);
      for (const sx of [-8, 8]) for (const sy of [-1.6, 1.6]) { circ(sx * d.s, sy * d.s, 2.2 * d.s); ctx.fill(); }
      ctx.restore();
      break;
    case 'gem': {
      const idx = clamp(Math.floor((d.y - FIRST_SHAFT_Y + 80) / SHAFT_SPACING), 0, ORES.length - 1);
      const ore = ORES[idx];
      for (let k = 0; k < 3; k++) {
        drawCrystal(d.x + (k - 1) * 4 * d.s, d.y + (k === 1 ? -2 : 1), (2.4 + (k === 1 ? 1.4 : 0)) * d.s, (k - 1) * 0.4, ore, d.seed + k);
      }
      break;
    }
    case 'root': {
      ctx.strokeStyle = 'rgba(55,32,14,0.7)';
      ctx.lineWidth = 1.8 * d.s;
      const len = (22 + 40 * d.s);
      ctx.beginPath();
      ctx.moveTo(d.x, SURFACE_Y + 2);
      ctx.bezierCurveTo(d.x + 8 * Math.sin(d.a), SURFACE_Y + len * 0.35, d.x - 6 * Math.cos(d.a), SURFACE_Y + len * 0.7, d.x + 4 * Math.sin(d.a * 2), SURFACE_Y + len);
      ctx.stroke();
      ctx.lineWidth = 0.9;
      ln(d.x + 2, SURFACE_Y + len * 0.4, d.x + 12 * Math.cos(d.a), SURFACE_Y + len * 0.55);
      break;
    }
    case 'worm': {
      ctx.strokeStyle = '#e88a9a';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let k = 0; k <= 6; k++) {
        const px = d.x + k * 2.4, py = d.y + Math.sin(T * 3 + d.seed + k * 0.9) * 2;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      break;
    }
  }
}
function drawCrystal(x, y, s, a, ore, k) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  ctx.fillStyle = ore.c;
  ctx.beginPath();
  ctx.moveTo(0, -s * 1.5); ctx.lineTo(s * 0.65, -s * 0.5); ctx.lineTo(s * 0.55, s * 0.7);
  ctx.lineTo(0, s); ctx.lineTo(-s * 0.55, s * 0.6); ctx.lineTo(-s * 0.65, -s * 0.55);
  ctx.closePath();

/* ------------------------- Tunnel lighting -------------------------
   Tunnels are dark; every light source carves its own lit area out of the
   darkness, then the additive glow pass adds colour on top. */
let darkCv = null, darkCtx = null;
function lightHole(d, L) {
  const r = L.type === 'pool' ? L.r * 1.1 : L.r * 1.2;
  const a = L.type === 'hole' ? L.a : Math.min(1, L.a * 2.4 + 0.15);
  if (L.type === 'pool') {
    d.save();
    d.translate(L.x, L.y);
    d.scale(1, 0.22);
    const g = d.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, `rgba(0,0,0,${a})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = g;
    d.beginPath(); d.arc(0, 0, r, 0, Math.PI * 2); d.fill();
    d.restore();
    return;
  }
  const g = d.createRadialGradient(L.x, L.y, 0, L.x, L.y, r);
  g.addColorStop(0, `rgba(0,0,0,${a})`);
  g.addColorStop(0.55, `rgba(0,0,0,${a * 0.55})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  d.fillStyle = g;
  d.beginPath();
  if (L.type === 'cone') {
    const base = L.dir > 0 ? L.tilt : Math.PI - L.tilt;
    d.moveTo(L.x, L.y);
    d.arc(L.x, L.y, r, base - L.spread * 1.2, base + L.spread * 1.2);
    d.closePath();
  } else {
    d.arc(L.x, L.y, r, 0, Math.PI * 2);
  }
  d.fill();
}
function drawDarkness(top, bot, sx, sy) {

  const d = darkCtx;

  d.clearRect(0, 0, darkCv.width, darkCv.height);

  const prev = ctx;

      if (f + 24 < top || t - 50 > bot) return;

  d.fillRect(ELEV_X, SURFACE_Y - 2, ELEV_W, liftBottom - SURFACE_Y + 2);

  ctx.drawImage(darkCv, 0, 0);
  ctx.restore();

function drawLights() {

/* ----------------------------- Atmosphere ----------------------------- */
function hash01(n) {
  const s = Math.sin(n * 12.9898) * 43758.5453;
  return s - Math.floor(s);
}
function drawRain(xL, xR, top) {
  const a = R.rainAmt;
  if (a < 0.02) return;
  const n = Math.floor(170 * a);
  const H = SURFACE_Y - top + 26;
  const span = xR - xL + 120;
  ctx.strokeStyle = `rgba(200,215,240,${0.42 * a})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const sp = 420 + hash01(k + 3.1) * 160;
    const yy = (R.time * sp + hash01(k + 7.7) * H) % H;
    const y = top - 30 + yy;
    const x = xL - 20 + hash01(k + 1.3) * span - yy * 0.2;
    ctx.moveTo(x, y);
    ctx.lineTo(x - 2.4, y + 12);
  }
  ctx.stroke();
  ctx.strokeStyle = `rgba(215,228,248,${0.55 * a})`;
  for (let k = 0; k < n / 3; k++) {
    const cyc = R.time * 2.2 + hash01(k + 11.3);
    const ph = cyc % 1;
    const x = xL + hash01(k + 5.9 + Math.floor(cyc) * 0.37) * (xR - xL);
    ctx.globalAlpha = 1 - ph;
    ctx.beginPath();
    ctx.ellipse(x, SURFACE_Y - 3, 1 + ph * 5, 0.6 + ph * 1.2, 0, Math.PI, 0);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawDrips(i, top, fl) {

    const ceil = top + jag(i, dx) + 5;

    ctx.fillStyle = 'rgba(20,40,60,0.35)';

    const ph = (R.time * 0.42 + i * 0.37 + k * 0.61) % 1.5;

  txt('💎', x, y - 33 + Math.sin(R.time * 2) * 2, 12, '#000', 'center', FONT);

function drawSurfaceBack(xL, xR, top) {

  for (const [kind, tx, ts] of LAY.trees) {
    if (tx < xL - 60 || tx > xR + 60) continue;
    if (kind === 'p') drawPine(tx, ts, sway, D);
    else drawRoundTree(tx, ts, sway * 0.8, D);
  }
  drawGround(xL, xR);
}
function drawSurfaceFront(xL, xR, top) {
  drawWinchHouse();
  drawHeadframe();
  if (LAY.fence) drawFence(LAY.fence[0], LAY.fence[1]);
  if (LAY.sign) drawSignpost(LAY.sign);
  for (const lx of LAY.lamps) drawLamp(lx);
  if (LAY.barrels) drawBarrels(LAY.barrels);
  addHit(WH_X, 124, WH_W, SURFACE_Y - 124, () => tapWarehouse());
  addHit(LOAD_X - 20, SURFACE_Y - 50, WH_DOOR_X - LOAD_X + 20, 48, () => tapWarehouse());
  drawBooth();
  drawCrate(LAY.boothX + 8, SURFACE_Y - 30, LAY.crateW, 27, S.surfaceStash, '#a8763a', '#ffd84d');

  const D = R.day;
  const tint = D.night * 0.45 + D.dusk * 0.08;
  if (tint > 0.01) {
    ctx.fillStyle = D.dusk > 0.3 && D.night < 0.6 ? `rgba(60,20,50,${tint})` : `rgba(6,10,38,${tint})`;
    ctx.fillRect(xL, top - 2, xR - xL, SURFACE_Y + 8 - top);
  }

}
function render() {
  computeOffX();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0d0805';
  ctx.fillRect(0, 0, VW, VH);
  let sx = 0, sy = 0;
  if (R.shake > 0) { sx = (Math.random() - 0.5) * R.shake * 10; sy = (Math.random() - 0.5) * R.shake * 10; }
  ctx.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, DPR * (OFFX + sx), DPR * (-R.camY * SCALE + sy));
  const top = R.camY, bot = R.camY + VH / SCALE;
  const xL = -OFFX / SCALE - 20, xR = (VW - OFFX) / SCALE + 20;
  R.hits.length = 0;
  R.lights.length = 0;
  R.day = dayInfo();
  const surf = top < SURFACE_Y + 20;
  if (surf) drawSurfaceBack(xL, xR, top);
  drawUnderground(xL, xR, top, bot);
  drawElevShaft(top, bot);
  const n = S.shafts.length;
  for (let i = 0; i < n; i++) {
    if (floorY(i) + 24 < top || shaftY(i) - 50 > bot) continue;
    drawShaft(i);
  }
  if (n < MAX_SHAFTS && !(floorY(n) + 24 < top || shaftY(n) - 50 > bot)) drawLocked(n);
  drawCabin();
  if (surf) drawSurfaceFront(xL, xR, top);
  drawDarkness(top, bot, sx, sy);
  drawParticles();
  drawLights();
  drawOverlay(top, bot);
  drawTexts();
  drawRipples();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScreenFx();
}

const Snd = {
  ctx: null, master: null, lastCoin: 0, lastClink: 0,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.16;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  tone(f, d, type, v, f2, delay) {
    if (!S.sound || !this.ctx) return;
    const t = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v || 0.4, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t + d + 0.03);
  },
  coin() {
    const t = performance.now();
    if (t - this.lastCoin < 110) return;
    this.lastCoin = t;
    this.tone(1320, 0.08, 'square', 0.14);
    this.tone(1760, 0.14, 'square', 0.12, null, 0.06);
  },
  clink() {
    const t = performance.now();
    if (t - this.lastClink < 170) return;
    this.lastClink = t;
    this.tone(2200 + Math.random() * 600, 0.05, 'triangle', 0.05, 1400);
  },
  click() { this.tone(520, 0.07, 'triangle', 0.3, 300); },
  upgrade() { [523, 659, 784, 1046].forEach((f, k) => this.tone(f, 0.14, 'triangle', 0.3, null, k * 0.055)); },
  buy() { [392, 523, 659, 784, 1046].forEach((f, k) => this.tone(f, 0.22, 'sawtooth', 0.1, null, k * 0.07)); },
  rush() { this.tone(200, 0.6, 'sawtooth', 0.16, 900); this.tone(300, 0.6, 'square', 0.08, 1200, 0.1); },
  deny() { this.tone(180, 0.16, 'square', 0.18, 120); },
  reveal(r) {
    const notes = [523, 587, 659, 784, 880, 1046, 1175, 1319, 1568];
    const n = 3 + r;
    for (let k = 0; k < n; k++) this.tone(notes[k], 0.2, r >= 4 ? 'sawtooth' : 'triangle', r >= 4 ? 0.16 : 0.24, null, k * 0.07);
    if (r >= 4) this.tone(2093, 0.8, 'sine', 0.2, null, n * 0.07);
  },
  gem() { [1568, 2093, 2637].forEach((f, k) => this.tone(f, 0.18, 'sine', 0.22, null, k * 0.05)); },
};

function milestoneInfo(kind, L, maxL) {
  const crew = kind === 'shaft' ? [10, 20, 30, 40, 50] : kind === 'warehouse' ? [12, 24, 36, 48] : [];
  const all = [...new Set([...crew, ...MILESTONES])].sort((a, b) => a - b);
  const next = all.find((m) => m > L && m <= (maxL || Infinity));
  if (!next) return null;
  const prev = [...all].reverse().find((m) => m <= L) || 1;
  const parts = [];
  if (crew.includes(next)) parts.push(kind === 'shaft' ? '+1 miner' : '+1 hauler');
  if (MILESTONES.includes(next)) parts.push(kind === 'elevator' ? '×2 capacity' : '×2 load');
  return { next, prev, pct: (L - prev) / (next - prev), text: parts.join(' and ') };
}
function buyPlan(def) {
  const L = def.obj.level;
  const room = (def.maxLevel || Infinity) - L;
  if (room <= 0) return { n: 0, cost: 0, afford: false, maxed: true };
  let n = 0, cost = 0;
  if (UI.buyAmt === 'max') {
    while (n < Math.min(1000, room)) {
      const c = def.cost(L + n);
      if (cost + c > S.cash) break;
      cost += c;
      n++;
    }
    if (n === 0) { n = 1; cost = def.cost(L); }
  } else {
    n = Math.min(UI.buyAmt, room);
    for (let k = 0; k < n; k++) cost += def.cost(L + k);
  }
  return { n, cost, afford: S.cash >= cost };
}
function openUpgrade(kind, i) {

function paintPortrait(canvas, seed, color) {
  const prev = ctx;

    ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    bg.addColorStop(0, color ? mixHex(color, '#ffffff', 0.7) : '#fff2cf');

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawManager(canvas.width / 2, canvas.height * 0.99, managerLook(seed), canvas.height / 46);
  } finally {
    ctx = prev;
  }
}

const BOXES = [

const canBuyBox = (b) => (b.cur === 'gems' ? S.gems >= b.price : S.cash >= b.price);
function rollRarity(odds) {
  const total = odds.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let k = 0; k < odds.length; k++) { r -= odds[k]; if (r < 0 && odds[k] > 0) return k; }
  return odds.findIndex((o) => o > 0);
}
function createManager(r) {
  const m = { id: S.nextMgrId++, seed: S.nextSeed, r, buff: 'cash' };
  S.nextSeed += 1 + Math.floor(Math.random() * 7);
  S.managers.push(m);
  return m;
}
function sortedManagers() {
  return [...S.managers].sort((a, b) => b.r - a.r || (a.buff < b.buff ? -1 : a.buff > b.buff ? 1 : 0) || a.id - b.id);
}
function assignedCount() { return S.managers.filter((m) => assignedWhere(m.id)).length; }
function firstEmptyArea() { return areasList().find((a) => !areaMgr(a.kind, a.i)) || null; }
function autoAssign() {
  const pool = S.managers.filter((m) => { const w = assignedWhere(m.id); return !w || w.mine === S.activeMine; })
    .sort((a, b) => mgrMult(b) - mgrMult(a) || b.r - a.r);
  const take = (pred) => { const k = pool.findIndex(pred); return k < 0 ? null : pool.splice(k, 1)[0]; };
  S.assign = { elevator: null, warehouse: null, shafts: [] };
  let m = take((x) => x.buff === 'cash') || take(() => true);
  if (m) S.assign.warehouse = m.id;
  m = take(() => true);
  if (m) S.assign.elevator = m.id;
  for (let i = S.shafts.length - 1; i >= 0; i--) {
    m = take(() => true);
    if (m) S.assign.shafts[i] = m.id;
  }
  syncAssign();

  el.className = 'bfx phase-drop';

    const cr = card.getBoundingClientRect(), sr = spot.getBoundingClientRect();
    const dx = cr.left + cr.width / 2 - (sr.left + sr.width / 2);
    const dy = cr.top + cr.height / 2 - (sr.top + sr.height / 2);

function fxRevealNext() {
  const st = BoxFx.state;

  const k = st.shown;
  if (k >= st.order.length) { fxRevealDone(); return; }
  if (st.order.length === 1) { fxRevealCard(0, false); fxLater(650, fxRevealNext); return; }
  fxSpotlight(k);
}
function fxRevealDone() {
  const st = BoxFx.state;
  if (!st) return;
  clearFxTimers();
  for (let k = 0; k < st.order.length; k++) fxRevealCard(k, true);
  st.revealing = false;
  const spot = BoxFx.el.querySelector('.bfx-spot');
  if (spot) { spot.className = 'bfx-spot'; spot.removeAttribute('style'); spot.innerHTML = ''; }
  const multi = st.order.length > 1;

  if (title) {

    title.classList.remove('bump-in');
    void title.offsetWidth;
    title.classList.add('bump-in');
  }
  const counts = document.getElementById('fxCounts');

    counts.innerHTML = RARITIES.map((r, k) => {
      const c = st.got.filter((m) => m.r === k).length;
      return c ? `<span class="r-${r.id}">${c} ${r.name}</span>` : '';
    }).join('');
  }
  const res = BoxFx.el.querySelector('.bfx-results');
  if (res) { res.classList.remove('spotting'); res.classList.add('done'); }
  Snd.reveal(st.best);
  if (st.best >= 3) spawnConfetti(WORLD_W / 2, R.camY + (VH / SCALE) * 0.3, 40 + st.best * 15);
  if (st.best >= 4) {
    const top = [...st.order].sort((a, b) => b.r - a.r)[0];

}

/* ---------- boost all managers ---------- */
function managedAreas() {
  const list = [];
  S.shafts.forEach((sh, i) => { if (sh.manager) list.push({ kind: 'shaft', i, obj: sh }); });
  if (S.elevator.manager) list.push({ kind: 'elevator', i: 0, obj: S.elevator });
  if (S.warehouse.manager) list.push({ kind: 'warehouse', i: 0, obj: S.warehouse });
  return list;
}
function boostAll() {
  Snd.unlock();
  const t = now();
  const ready = managedAreas().filter((a) => t >= a.obj.readyAt);
  if (!ready.length) {
    Snd.deny();
    toast('No managers are ready yet');
    return;
  }
  for (const a of ready) {
    a.obj.boostUntil = t + odDur() * 1000;
    a.obj.readyAt = a.obj.boostUntil + odCd() * 1000;
    const [x, y] = areaAnchor(a.kind, a.i);
    spawnBurst(x, y, ORES[4], 8);
  }
  Snd.rush();
  buzz(30);
  R.shake = 0.25;
  toast(`⚡ Overdrive on ${ready.length} manager${ready.length > 1 ? 's' : ''} for ${odDur()}s`);
}
function updateBoostAllBtn() {
  const btn = $('#btnBoostAll');
  const list = managedAreas();
  if (!list.length) {
    if (!btn.classList.contains('hidden')) btn.classList.add('hidden');
    return;
  }
  btn.classList.remove('hidden');
  const t = now();
  const ready = list.filter((a) => t >= a.obj.readyAt).length;
  const activeLeft = Math.max(0, ...list.map((a) => a.obj.boostUntil - t));
  let cls, label, count;
  if (ready > 0) {
    cls = 'ready';
    label = '⚡ Boost all';
    count = `${ready}/${list.length} ready`;
  } else if (activeLeft > 0) {
    cls = 'active';
    label = `⚡ Boosting · ${Math.ceil(activeLeft / 1000)}s`;
    count = '';
  } else {
    cls = 'cooldown';
    const next = Math.min(...list.map((a) => a.obj.readyAt - t));
    label = `Recharging · ${fmtTime(next / 1000)}`;
    count = '';
  }
  if (btn.dataset.cls !== cls) { btn.className = 'boost-all ' + cls; btn.dataset.cls = cls; }
  const lb = $('#baLabel'), cn = $('#baCount');
  if (lb.textContent !== label) lb.textContent = label;
  if (cn.textContent !== count) { cn.textContent = count; cn.classList.toggle('hidden', !count); }
}

/* ---------- world map: travel between mines ---------- */
function mineIdleRate(id) {
  if (id === S.activeMine) return idleRate();
  const d = S.mineData[id];
  return d ? d.idleAtLeave || 0 : 0;
}
function minePending(id) {
  const d = S.mineData[id];
  if (!d || !d.leftAt || !d.idleAtLeave) return 0;
  const away = Math.max(0, (now() - d.leftAt) / 1000);
  return d.idleAtLeave * Math.min(away, offlineCapH() * 3600);
}
function stashTransit() {
  R.miners.forEach((arr, i) => { if (arr && S.shafts[i]) for (const m of arr) S.shafts[i].stash += m.carry; });
  for (const t of R.trans) S.surfaceStash += t.carry;
  S.surfaceStash += R.cabin.carry;
  R.cabin.carry = 0;
}
function resetRuntime() {
  R.miners = [];
  R.trans = [];
  R.cabin = { y: CABIN_TOP_STOP, state: 'idle', target: 0, carry: 0, trip: 0, wait: 0.4, wheel: 0, vy: 0, v: 0, color: ORES[0].c };
  R.particles.length = 0;
  R.texts.length = 0;
  R.coins.length = 0;
  R.ripples.length = 0;
  R.earnLog.length = 0;
  R.geode = null;
  scheduleGeode(now());
  R.camY = 0;
  R.camV = 0;
  R.camTarget = null;
}
function travelTo(id) {
  if (id === S.activeMine || !S.minesUnlocked[id]) return;
  stashTransit();
  const leaving = {};
  for (const k of MINE_KEYS) leaving[k] = JSON.parse(JSON.stringify(S[k]));
  leaving.leftAt = now();
  leaving.idleAtLeave = idleRate();
  S.mineData[S.activeMine] = leaving;
  const d = S.mineData[id] ? mergeMine(S.mineData[id], id) : freshMine(id);
  delete S.mineData[id];
  S.activeMine = id;
  applyTheme(id);
  for (const k of MINE_KEYS) S[k] = d[k];
  syncAssign();
  if (S.event && S.event.type === 'vein' && S.event.shaft >= S.shafts.length) S.event.shaft = 0;
  resetRuntime();
  syncEntities(false);
  R.dispCash = S.cash;
  // Earnings while this mine ran on its own.
  let bonus = 0;
  if (d.leftAt && d.idleAtLeave) {
    const away = Math.max(0, (now() - d.leftAt) / 1000);
    bonus = d.idleAtLeave * Math.min(away, offlineCapH() * 3600);
    S.cash += bonus;
    S.totalEarned += bonus;
  }
  R.flash = 0.9;
  closeModal();
  Snd.rush();
  buzz(25);
  toast(`${THEME.icon} Welcome to the ${THEME.name}!` + (bonus > 1 ? ` Your managers earned $${fmt(bonus)} while you were away.` : ''));
  save();
}
function unlockMine(id) {
  const th = THEMES[id];
  if (!th || S.minesUnlocked[id]) return;
  if (S.cash < th.unlock) {
    Snd.deny();
    toast(`You need $${fmt(th.unlock - S.cash)} more to unlock the ${th.name}`);
    return;
  }
  S.cash -= th.unlock;
  S.minesUnlocked[id] = true;
  S.mineData[id] = freshMine(id);
  Snd.buy();
  buzz(40);
  toast(`🗺️ ${th.name} unlocked!`);
  spawnConfetti(WORLD_W / 2, R.camY + (VH / SCALE) * 0.35, 70);
  save();
  renderMap();
}

/* ---------- save backups ---------- */
const BACKUP_KEY = SAVE_KEY + '-backups';
const BACKUP_KEEP = 5;
function readBackups() {
  try {
    const a = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]');
    return Array.isArray(a) ? a.filter((b) => b && b.data && typeof b.at === 'number') : [];
  } catch (e) { return []; }
}
function backupSummary(st) {
  const coal = st.activeMine === 'coal' ? st.shafts : st.mineData && st.mineData.coal ? st.mineData.coal.shafts : [];
  const emer = st.activeMine === 'emerald' ? st.shafts : st.mineData && st.mineData.emerald ? st.mineData.emerald.shafts : null;
  return {
    mine: (THEMES[st.activeMine] || THEMES.coal).name,
    coal: (coal || []).length,
    emerald: emer ? emer.length : 0,
    cash: st.cash,
    managers: (st.managers || []).length,
    rebirths: st.rebirths || 0,
  };
}
function makeBackup(reason) {
  if (R.loadFailed) return;
  try {
    const copy = JSON.parse(JSON.stringify(S));
    const list = readBackups();
    const top = list[0];
    // Skip identical auto backups taken close together.
    if (reason === 'auto' && top && now() - top.at < 60000) return;
    list.unshift({ at: now(), reason, summary: backupSummary(copy), data: copy });
    localStorage.setItem(BACKUP_KEY, JSON.stringify(list.slice(0, BACKUP_KEEP)));
  } catch (e) { /* storage full or unavailable */ }
}
function restoreBackup(i) {
  const b = readBackups()[i];
  if (!b) return;
  R.loadFailed = false;
  S = mergeState(b.data);
  applyTheme(S.activeMine);
  resetRuntime();
  syncEntities(false);
  R.dispCash = S.cash;
  save();
  closeModal();
  R.flash = 0.8;
  Snd.buy();
  toast(`🛟 Backup restored: ${b.summary.mine}, ${b.summary.coal} Coal shafts, $${fmt(b.summary.cash)}`);
}

      <div class="offline-amt">$${fmt(amount)}</div>
      <p class="m-muted" style="text-align:center;margin:0 0 14px">${capped ? 'Idle earnings are capped at ' + offlineCapH() + ' hours.' : 'Based on your current idle rate of $' + fmt(idleRate()) + '/s.'}</p>
      <button class="big-btn" data-act="collect"><span>Collect</span><span class="bb-c"><span class="mini-coin"></span>${fmt(amount)}</span></button>
    </div>`;
  openModal(html, {
    collect: () => {
      S.cash += amount;
      S.totalEarned += amount;
      Snd.unlock();
      Snd.buy();
      closeModal();
      spawnCoinsToHud(WH_X + WH_W / 2, 220, 7);
    },
  });
}
function grantOffline(sec, withModal) {
  if (sec < 30) return;
  const rate = idleRate();
  if (rate <= 0) {
    if (withModal && sec > 120) toast('Hire managers for the lift and depot to earn while away');
    return;
  }
  const counted = Math.min(sec, offlineCapH() * 3600);
  const amount = rate * counted;
  if (withModal) openOffline(amount, sec, counted);
  else {
    S.cash += amount;
    S.totalEarned += amount;
    toast(`While you were away: +$${fmt(amount)}`);
  }
}
function toggleSound() {
  S.sound = !S.sound;
  if (S.sound) { Snd.unlock(); Snd.click(); }
  save();
}
function resetGame() {
  makeBackup('reset');
  R.loadFailed = false;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  S = defaultState();
  applyTheme('coal');
  R.miners = [];
  R.trans = [];
  R.cabin = { y: CABIN_TOP_STOP, state: 'idle', target: 0, carry: 0, trip: 0, wait: 0, wheel: 0, vy: 0, color: ORES[0].c };
  R.particles.length = 0;
  R.texts.length = 0;
  R.earnLog.length = 0;
  R.camY = 0;
  R.dispCash = S.cash;
  R.geode = null;
  scheduleGeode(now());
  scheduleNextEvent(now());
  syncEntities(false);
  closeModal();
  toast('Fresh start! Tap the mineshaft to begin');
  save();
}
function tutorialStep() {
  if (S.tutorialDone) return;
  S.tutorialDone = true;
  setTimeout(() => toast('Next: tap the lift, then tap the haulers at the depot'), 1200);
}

/* ---------- HUD ---------- */
function updateHud(dt) {
  if (S.cash < R.dispCash) R.dispCash = S.cash;
  else R.dispCash += (S.cash - R.dispCash) * Math.min(1, dt * 7);
  if (Math.abs(S.cash - R.dispCash) < 0.5) R.dispCash = S.cash;
  const s = '$' + fmt(R.dispCash);
  if (s !== UI.lastCash) { $('#cash').textContent = s; UI.lastCash = s; }
  UI.ipsT -= dt;
  if (UI.ipsT <= 0) {
    UI.ipsT = 0.5;
    $('#ips').textContent = '$' + fmt(measuredIps());
    const ir = idleRate();
    const tag = $('#idleTag');
    tag.textContent = ir > 0 ? `idle $${fmt(ir)}/s` : 'no idle income';
    tag.classList.toggle('off', ir <= 0);
  }
  updateEventChip();
  updateGemHud();
  updateRebirthHud();
  updateMgrHud();
  updateMapHud();
  updateBoostAllBtn();
  R.flash = Math.max(0, (R.flash || 0) - dt * 1.4);
  UI.refreshT -= dt;
  if (UI.refresh && UI.refreshT <= 0) { UI.refreshT = 0.25; UI.refresh(); }
}

/* -------------------------------- Input -------------------------------- */
let drag = null;
function toWorld(px, py) {
  return [(px - OFFX) / SCALE, py / SCALE + R.camY];
}
function hitAt(wx, wy) {
  for (let k = R.hits.length - 1; k >= 0; k--) {
    const h = R.hits[k];
    if (wx >= h.x && wx <= h.x + h.w && wy >= h.y && wy <= h.y + h.h) return h;
  }
  return null;
}
function localPoint(e) {
  const r = cv.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function hideScrollHint() { $('#scrollHint').classList.add('gone'); }
cv.addEventListener('pointerdown', (e) => {
  Snd.unlock();
  cv.setPointerCapture(e.pointerId);
  const [x, y] = localPoint(e);
  drag = { id: e.pointerId, x, y, sx: x, sy: y, t: performance.now(), moved: false, vy: 0, vx: 0 };
  R.camV = 0;
  R.camVX = 0;
  R.camTarget = null;
});
cv.addEventListener('pointermove', (e) => {
  const [x, y] = localPoint(e);
  if (drag && drag.id === e.pointerId) {
    const dx = x - drag.x, dy = y - drag.y;
    if (Math.hypot(x - drag.sx, y - drag.sy) > 7) drag.moved = true;
    if (drag.moved) {
      const t = performance.now();
      const dtm = Math.max(1, t - drag.t);
      R.camY -= dy / SCALE;
      R.camX -= dx / SCALE;
      drag.vy = lerp(drag.vy, (-dy / SCALE) / dtm * 16, 0.5);
      drag.vx = lerp(drag.vx, (-dx / SCALE) / dtm * 16, 0.5);
      drag.t = t;
      clampCam();
      cv.style.cursor = 'grabbing';
      hideScrollHint();
    }
    drag.x = x;
    drag.y = y;
  } else {
    const [wx, wy] = toWorld(x, y);
    cv.style.cursor = hitAt(wx, wy) ? 'pointer' : 'grab';
  }
});
function endDrag(e) {
  if (!drag || drag.id !== e.pointerId) return;
  if (!drag.moved) {
    const [wx, wy] = toWorld(drag.sx, drag.sy);
    const h = hitAt(wx, wy);
    if (h) { addRipple(wx, wy); h.fn(); }
  } else {
    R.camV = drag.vy;
    R.camVX = drag.vx;
  }
  drag = null;
  cv.style.cursor = 'grab';
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', (e) => { if (drag && drag.id === e.pointerId) drag = null; });
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const maxY = Math.max(0, worldHeight() - VH / SCALE);
  const unit = e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? VH : 1;
  R.camTarget = clamp((R.camTarget === null ? R.camY : R.camTarget) + (e.deltaY * unit) / SCALE, 0, maxY);
  R.camX += (e.deltaX * unit) / SCALE * 0.8;
  clampCam();
  hideScrollHint();
}, { passive: false });
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && BoxFx.state) { const st = BoxFx.state; if (st.phase === 'results' && !st.revealing) closeFx(); return; }
  if (e.key === 'Escape' && !modalRoot.classList.contains('hidden')) { if (!UI.locked) closeModal(); return; }
  if (!modalRoot.classList.contains('hidden')) return;
  const step = VH / SCALE * 0.4;
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { R.camTarget = R.camY + step; e.preventDefault(); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { R.camTarget = R.camY - step; e.preventDefault(); }
  if (e.key === 'Home') R.camTarget = 0;
  if (e.key === 'End') R.camTarget = worldHeight();
});
$('#btnMap').addEventListener('click', () => { Snd.unlock(); openMap(); });
$('#btnResearch').addEventListener('click', () => { Snd.unlock(); openResearch(); });
$('#eventChip').addEventListener('click', focusEvent);
$('#btnRebirth').addEventListener('click', () => { Snd.unlock(); openRebirth(); });
$('#btnBoostAll').addEventListener('click', boostAll);
$('#btnManagers').addEventListener('click', () => { Snd.unlock(); openManagers(); });
$('#btnStats').addEventListener('click', () => { Snd.unlock(); openStats(); });
$('#btnSettings').addEventListener('click', () => { Snd.unlock(); openSettings(); });

function updateCamera(dt) {
  const moved = Math.abs(R.camY - (R.lastCamY === undefined ? R.camY : R.lastCamY)) > 0.05;
  R.lastCamY = R.camY;
  R.gaugeHold = moved ? 1.2 : Math.max(0, (R.gaugeHold || 0) - dt);
  R.gaugeA = clamp((R.gaugeA || 0) + (R.gaugeHold > 0 ? dt * 6 : -dt * 3), 0, 1);
  if (R.camTarget !== null) {
    const vh = VH / SCALE;
    const goal = clamp(R.camTarget, 0, Math.max(0, worldHeight() - vh));
    R.camY += (goal - R.camY) * Math.min(1, dt * 9);
    if (Math.abs(goal - R.camY) < 0.5) { R.camY = goal; R.camTarget = null; }
  } else if (!drag) {
    R.camY += R.camV * dt * 60;
    R.camX += R.camVX * dt * 60;
    const f = Math.pow(0.9, dt * 60);
    R.camV *= f;
    R.camVX *= f;
    if (Math.abs(R.camV) < 0.02) R.camV = 0;
    if (Math.abs(R.camVX) < 0.02) R.camVX = 0;
  }
  clampCam();
}

/* ------------------------------- Main loop ------------------------------- */
let last = performance.now();
let saveT = 5;
function frame(t) {
  let dt = (t - last) / 1000;
  last = t;
  if (!(dt > 0)) dt = 0.016;
  dt = Math.min(dt, 0.1);
  R.time += dt;
  S.playTime += dt;
  try {
    updateMiners(dt);
    updateCabin(dt);
    updateTrans(dt);
    updateAmbient(dt);
    updateEvents(dt);
    updateParticles(dt);
    updateCamera(dt);
    render();
    updateHud(dt);
  } catch (err) {
    if (!R.errLogged) { R.errLogged = true; console.error('Frame error (the game keeps running):', err); }
  }
  saveT -= dt;
  if (saveT <= 0) { saveT = 5; save(); }
  R.backupT = (R.backupT || 300) - dt;
  if (R.backupT <= 0) { R.backupT = 300; makeBackup('auto'); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    R.hiddenAt = now();
    save();
  } else if (R.hiddenAt) {
    grantOffline((now() - R.hiddenAt) / 1000, false);
    R.hiddenAt = 0;
    last = performance.now();
  }
});
window.addEventListener('pagehide', save);
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('#stage'));

function init() {
  const pref = loadLayoutPref();
  applyLayout(pref || recommendedLayout());
  if (LAY.mode === 'mobile') R.camX = 0;
  let saved = null;
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
  if (raw) {
    try { saved = JSON.parse(raw); } catch (e) { R.loadFailed = true; }
  }
  try {
    S = mergeState(saved);
  } catch (e) {
    console.error('Could not load save:', e);
    R.loadFailed = true;
    S = defaultState();
  }
  if (R.loadFailed) setTimeout(() => toast('⚠️ Your save could not be loaded. It is kept safe and was not overwritten. You can restore a backup in Settings.'), 800);
  else if (saved) makeBackup('load');
  applyTheme(S.activeMine);
  syncEntities(false);
  R.dispCash = S.cash;
  if (!S.nextEventAt || S.nextEventAt < now() - 1000 && !S.event) scheduleNextEvent(now());
  R.nextGeodeAt = now() + (70 + Math.random() * 60) * 1000;
  resize();
  genStatic();
  const awaySec = saved && saved.lastSave ? (now() - saved.lastSave) / 1000 : 0;
  const welcome = () => {
    if (awaySec) grantOffline(awaySec, true);
    if (!S.tutorialDone) setTimeout(() => toast('Tap the mineshaft to send your miner digging'), 700);
  };
  if (!pref) openLayoutChooser(true, welcome);
  else welcome();
  setTimeout(hideScrollHint, 9000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { UI.lastCash = ''; });
  requestAnimationFrame((t) => { last = t; frame(t); });
}
init();
})();

</script>
</body>
</html>
